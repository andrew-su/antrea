tlsCipherSuites: "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_256_GCM_SHA384"
antreaAgentTweaker:
  enable: true
enableResourceInit: true
trafficEncapMode: "{{ if .AntreaNSXRouted }}noEncap{{ else }}encap{{ end }}"
noSNAT: "{{if .AntreaNSXRouted }}true{{else}}false{{ end }}"
serviceCIDR: "{{ .ClusterIPCIDR }}"
controller:
  selfSignedCert: "{{ if .UseCertFromProvider }}false{{ else }}true{{ end }}"
  tlsSecretName: "{{ if .ProviderCertSecretName }}{{ .ProviderCertSecretName }}{{ else }}antrea-controller-tls{{ end }}"
nodePortLocal:
  enable: true
advanced: true
