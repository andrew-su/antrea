{{- if .Values.ods.enable }}
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: antrea-ods
  labels:
    app: antrea
rules:
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
      - namespaces
      - endpoints
      - services
    verbs:
      - get
      - watch
      - list
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: antrea-ods
  namespace: {{ .Release.Namespace }}
  labels:
    app: antrea
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: antrea-ods
  labels:
    app: antrea
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: antrea-ods
subjects:
  - kind: ServiceAccount
    name: antrea-ods
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: antrea-ods
  namespace: {{ .Release.Namespace }}
  labels:
    app: antrea
    component: antrea-ods
spec:
  selector:
    matchLabels:
      app: antrea
      component: antrea-ods
  replicas: 1
  template:
    metadata:
      labels:
        app: antrea
        component: antrea-ods
    spec:
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: true
      priorityClassName: {{ .Values.controller.priorityClassName }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | trim | nindent 8 }}
      {{- end }}
      {{- if .Values.testing.simulator.enable }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: antrea/instance
                    operator: NotIn
                    values:
                      - simulator
      {{- else }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | trim | nindent 8 }}
      {{- end }}
      {{- end }}
      serviceAccountName: antrea-ods
      containers:
        - name: antrea-ods
          image: {{ include "antreaOdsImage" . | quote }}
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 200m
          command: [ "/opt/vmware/sha/bin/sha" ]
{{- end }}
