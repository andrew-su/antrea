{{if .Values.advanced}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tierentitlementbindings.crd.antrea.tanzu.vmware.com
  labels:
    app: antrea
spec:
  group: crd.antrea.tanzu.vmware.com
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              required:
                - tierEntitlement
                - subjects
              type: object
              properties:
                tierEntitlement:
                  type: string
                subjects:
                  type: array
                  items:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum: ['User', 'Group', 'ServiceAccount']
                      apiGroup:
                        type: string
                        enum: ['rbac.authorization.k8s.io']
                      name:
                        type: string
                      namespace:
                        type: string
  scope: Cluster
  names:
    plural: tierentitlementbindings
    singular: tierentitlementbinding
    kind: TierEntitlementBinding
    shortNames:
      - teb
{{end}}
