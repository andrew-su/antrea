{{if .Values.advanced}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: egressentitlements.crd.antrea.io
  labels:
    app: antrea
spec:
  group: crd.antrea.io
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              required:
                - externalIPPools
                - egressIPs
                - appliedToScope
              type: object
              properties:
                externalIPPools:
                  type: array
                  items:
                    type: string
                egressIPs:
                  type: array
                  items:
                    type: string
                    oneOf:
                    - format: ipv4
                    - format: ipv6
                    - pattern: '^\*$'
                appliedToScope:
                  type: object
                  properties:
                    namespaceSelector:
                      type: object
                      properties:
                        matchExpressions:
                          type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                              operator:
                                enum:
                                  - In
                                  - NotIn
                                  - Exists
                                  - DoesNotExist
                                type: string
                              values:
                                type: array
                                items:
                                  type: string
                                  pattern: "^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$"
                        matchLabels:
                          type: object
                          additionalProperties:
                            type: string
                            pattern: "^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$"  
  scope: Cluster
  names:
    plural: egressentitlements
    singular: egressentitlement
    kind: EgressEntitlement
{{end}}
