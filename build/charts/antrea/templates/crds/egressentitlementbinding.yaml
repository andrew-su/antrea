{{if .Values.advanced}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: egressentitlementbindings.crd.antrea.io
  labels:
    app: antrea
spec:
  group: crd.antrea.io
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              required:
                - egressEntitlement
                - subjects
              type: object
              properties:
                egressEntitlement:
                  type: string
                subjects:
                  type: array
                  items:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum: ['User', 'Group', 'ServiceAccount']
                      apiGroup:
                        type: string
                        enum: ['rbac.authorization.k8s.io']
                      name:
                        type: string
                      namespace:
                        type: string
  scope: Cluster
  names:
    plural: egressentitlementbindings
    singular: egressentitlementbinding
    kind: EgressEntitlementBinding
{{end}}
