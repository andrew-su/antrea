kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    app: flow-aggregator
  name: {{ template "flow-aggregator.clusterRoleBinding" (dict "root" $) }}
subjects:
  - kind: ServiceAccount
    name: flow-aggregator
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ template "flow-aggregator.clusterRole" (dict "root" $) }}
  apiGroup: rbac.authorization.k8s.io
---
# For auth delegation to apiserver
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    app: flow-aggregator
  name: {{ template "flow-aggregator.clusterRoleBinding" (dict "root" $ "id" "auth-delegator") }}
subjects:
  - kind: ServiceAccount
    name: flow-aggregator
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
