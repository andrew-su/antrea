apiVersion: v1
kind: Namespace
metadata:
  name: vmware-system-antrea
  labels:
    app: antrea-interworking
    openshift.io/run-level: '0'
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest

---
# NOTE: In production the bootstrap config and secret should be filled by admin
# manually or external automation mechanism.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bootstrap-config
  namespace: vmware-system-antrea
data:
  bootstrap.conf: |
    # bootstrapFrom is used to specify the bootstrap method: either Inline or SupervisorCluster.
    # bootstrapFrom can be "Inline" and "SupervisorCluster"
    # If "SupervisorCluster" is set, bootstrapSupervisorResourceName must be set, and clusterName, NSXManagers, vpcPath,
    # ProxyEndpoints will be filled automatically by register job.
    bootstrapFrom: "Inline"
    # bootstrapSupervisorResourceName is a string representing the resource name of the supervisor used during the bootstrap process.
    # bootstrapSupervisorResourceName is required if bootstrapFrom is "SupervisorCluster".
    # The value should be NSXServiceAccount resource name in the SupervisorCluster.
    # bootstrapSupervisorResourceName: dummyClusterName-antrea

    # clusterName is the name of the cluster. Fill in the cluster name. It should be unique among the clusters managed by the NSX-T.
    clusterName: dummyClusterName
    # NSXManagers is a string slice that contains the IP address or domain name of the NSX Managers.
    # Fill in the NSX manager IPs. If there is only one IP, the value should be like [dummyNSXIP1]
    # If the value is IPv6 address with square brackets, a pair of single quotes are required. e.g. ['[aaa::aaa]', aaa::aab]
    NSXManagers: [dummyNSXIP1, dummyNSXIP2, dummyNSXIP3]
    # vhcPath is deprecated by vpcPath
    # vhcPath: ""
    # vpcPath is the VPC configuration path.
    # vpcPath is optional. It's for multi-tenancy isolation in NSX.
    vpcPath: ""
    # proxyEndpoints is a struct for proxy endpoints containing the information needed to access the API server.
    # proxyEndpoints is optional. If proxyEndpoints.rest-api is set, NSXManagers will be ignored.
    proxyEndpoints:
      # rest-api is a string slice that contains the IP address or domain name of the REST API endpoint.
      rest-api: []
      # nsx-rpc-fwd-proxy is a string slice that contains the IP address or domain name of the NSX RPC forward proxy.
      nsx-rpc-fwd-proxy: []
---
apiVersion: v1
kind: Secret
metadata:
  name: nsx-cert
  namespace: vmware-system-antrea
type: kubernetes.io/tls
data:
  # One line base64 encoded data. Can be generated by command: cat tls.crt | base64 -w 0
  tls.crt:
  # One line base64 encoded data. Can be generated by command: cat tls.key | base64 -w 0
  tls.key:
