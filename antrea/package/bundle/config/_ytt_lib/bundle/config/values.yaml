#@data/values
#@overlay/match-child-defaults missing_ok=True

---
infraProvider: vsphere
nodeSelector: null
deployment:
  updateStrategy: null
  rollingUpdate:
    maxUnavailable: null
    maxSurge: null
daemonset:
  updateStrategy: null

antrea:
  config:
    egress:
      exceptCIDRs: []
      maxEgressIPsPerNode: 255
    nodePortLocal:
      enabled: true
      portRange: 61000-62000
    antreaProxy:
      enable: true
      proxyAll: false
      nodePortAddresses: []
      skipServices: []
      proxyLoadBalancerIPs: true
      serviceProxyName: ""
      defaultLoadBalancerMode: "nat"
    flowExporter:
      enable: false
      collectorAddress: "flow-aggregator/flow-aggregator:4739:tls"
      pollInterval: "5s"
      activeFlowTimeout: "60s"
      idleFlowTimeout: "15s"
    clientCAFile: ""
    kubeAPIServerOverride: null
    transportInterface: null
    transportInterfaceCIDRs: []
    tunnelType: geneve
    tunnelPort: 0
    tunnelCsum: false
    trafficEncryptionMode: none
    packetInRate: 500
    wireGuard:
      port: 51820
    serviceCIDR: 10.96.0.0/12
    serviceCIDRv6: null
    enableUsageReporting: false
    trafficEncapMode: encap
    noSNAT: false
    disableUdpTunnelOffload: false
    #! Setting defaultMTU to null since antrea-agent will discover the MTU of the Node's primary interface and
    #! also adjust MTU to accommodate for tunnel encapsulation overhead.
    defaultMTU: 0
    tlsCipherSuites: TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_256_GCM_SHA384
    enableBridgingMode: false
    disableTXChecksumOffload: false
    dnsServerOverride: null
    multicastInterfaces: []
    multicast:
      enable: false
      igmpQueryInterval: "125s"
      igmpQueryVersions:
        - 1
        - 2
        - 3
    multicluster:
      enable: false
      namespace: null
      enableStretchedNetworkPolicy: false
      enablePodToPodConnectivity: false
      trafficEncryptionMode: "none"
      wireGuard:
        port: 51821
    cloudProvider:
      name: null
    auditLogging:
      maxSize: 500
      maxBackups: 3
      maxAge: 28
      compress: true
    featureGates:
      AntreaProxy: true
      AntreaTraceflow: true
      NodePortLocal: true
      AntreaPolicy: true
      FlowExporter: false
      NetworkPolicyStats: true
      Egress: true
      AntreaIPAM: false
      ServiceExternalIP: false
      Multicast: true
      Multicluster: false
      SecondaryNetwork: false
      TrafficControl: false
      TopologyAwareHints: true
      SupportBundleCollection: false
      L7NetworkPolicy: false
      AdminNetworkPolicy: false
      CleanupStaleUDPSvcConntrack: false
      NodeLatencyMonitor: false
      LoadBalancerModeDSR: false
      EgressTrafficShaping: false
      EgressSeparateSubnet: false
      NodeNetworkPolicy: false
      L7FlowExporter: false
  windows:
    enable: false
    config:
      nodePortLocal:
        enabled: true
        portRange: 41000-42000
      antreaProxy:
        enable: true
        proxyAll: true
        serviceProxyName: ""
      flowExporter:
        collectorAddress: "flow-aggregator/flow-aggregator:4739:tls"
        pollInterval: "5s"
        activeFlowTimeout: "60s"
        idleFlowTimeout: "15s"
      kubeAPIServerOverride: ""
      transportInterface: null
      transportInterfaceCIDRs: []
      tlsCipherSuites: TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_256_GCM_SHA384
      featureGates:
        AntreaProxy: true
        NodePortLocal: true
        FlowExporter: false

antrea_nsx:
  enable: false
  config:
    nsxCert: ZHVtbXlBZG1pbg
    nsxKey: ZHVtbXlQYXNzd29yZA
    clusterName: dummyClusterName
    bootstrapSupervisorResourceName: dummyClusterName-antrea
    NSXManagers: []
    vpcPath: ""
    bootstrapFrom: SupervisorCluster
    proxyEndpoints:
      rest_api: []
      nsx_rpc_fwd_proxy: []
    mp_adapter_conf:
      NSXClientAuthCertFile: /etc/antrea/nsx-cert/tls.crt
      NSXClientAuthKeyFile: /etc/antrea/nsx-cert/tls.key
      NSXRemoteAuth: false
      NSXCAFile: ""
      NSXInsecure: true
      NSXRPCConnType: tnproxy
      clusterType: kubernetes
      NSXClientTimeout: 120
      InventoryBatchSize: 50
      InventoryBatchPeriod: 5
      InventoryGCPeriod: 60
      EnableDebugServer: false
      APIServerPort: 16664
      DebugServerPort: 16666
      NSXRPCDebug: false
      ConditionTimeout: 150
      NSXVerifyServerName: false
    ccp_adapter_conf:
      EnableDebugServer: false
      APIServerPort: 16665
      DebugServerPort: 16667
      NSXRPCDebug: false
      #! Time to wait for realization
      RealizeTimeoutSeconds: 60
      #! An interval for regularly report latest realization error in background
      RealizeErrorSyncIntervalSeconds: 600
      ReconcilerWorkerCount: 8
      #! Average QPS = ReconcilerWorkerCount * ReconcilerQPS
      ReconcilerQPS: 5.0
      #! Peak QPS =  ReconcilerWorkerCount * ReconcilerBurst
      ReconcilerBurst: 10
      #! 24 Hours
      ReconcilerResyncSeconds: 86400
